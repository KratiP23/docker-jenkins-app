
name: Production Approval

on:
  pull_request:
    branches:
      - main

jobs:
  test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Compute image tag
        id: tag
        run: |
          echo "sha=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Pull image from Docker Hub
        run: |
          docker pull krati07/jenkins-docker-demo:${{ steps.tag.outputs.sha }}

      - name: Run container
        run: |
          docker run \
            --name test-container \
            krati07/jenkins-docker-demo:${{ steps.tag.outputs.sha }}

  production-approval:
    needs: test-image
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Production approved
        run: |
          echo "Approved for commit ${{ github.event.pull_request.head.sha }}"