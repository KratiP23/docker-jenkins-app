# .github/workflows/verify-image.yml
# IMPORTANT: this one lives in the docker-jenkins-app repo, not docker-jenkins.
# A pull_request workflow only runs if it sits in the repo the PR was opened in.
#
# Pulls the image Jenkins built for this commit and runs it on the GitHub
# runner. Nothing runs on your machine. This job is the required check on main,
# so the PR cannot be merged unless the container comes up.

name: Verify image

on:
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: krati07/jenkins-docker-demo
  RUN_SECONDS: 15

jobs:
  verify-image:
    runs-on: ubuntu-latest
    steps:
      - name: Work out the image tag
        run: echo "IMAGE_TAG=sha-${HEAD_SHA:0:12}" >> "$GITHUB_ENV"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Wait for Jenkins to publish the image
        run: |
          echo "Looking for $DOCKER_IMAGE:$IMAGE_TAG ..."
          for i in $(seq 1 30); do
            if docker pull "$DOCKER_IMAGE:$IMAGE_TAG"; then
              exit 0
            fi
            echo "Not published yet, retrying in 20s ($i/30)"
            sleep 20
          done
          echo "Jenkins never published an image for this commit."
          exit 1

      - name: Run the container
        run: |
          docker run -d --name verify "$DOCKER_IMAGE:$IMAGE_TAG"
          echo "Letting it run for ${RUN_SECONDS}s ..."
          sleep "$RUN_SECONDS"

          if [ "$(docker inspect -f '{{.State.Running}}' verify)" != "true" ]; then
            echo "Container is not running. Exit code: $(docker inspect -f '{{.State.ExitCode}}' verify)"
            docker logs verify
            exit 1
          fi
          echo "Container is running - image is good."

      - name: Container logs
        if: always()
        run: docker logs verify || true