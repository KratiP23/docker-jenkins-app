# .github/workflows/verify-image.yml
# Lives in the docker-jenkins-app repo (a pull_request workflow only runs
# from the repo the PR was opened in).
#
# Pulls the image Jenkins built for this commit and runs it on the runner.
# No container runs on your machine. This is the required check on main.

name: Verify image

on:
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: krati07/jenkins-docker-demo

jobs:
  verify-image:
    runs-on: ubuntu-latest
    steps:
      - name: Pull the image built for this commit
        run: |
          TAG=sha-${GITHUB_SHA:0:12}
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          docker pull "$DOCKER_IMAGE:$TAG"

      - name: Run it and check it stays up
        run: |
          docker run -d --name verify "$DOCKER_IMAGE:$IMAGE_TAG"
          sleep 15
          docker ps --filter "name=verify" --filter "status=running" | grep verify

      - name: Show logs
        if: always()
        run: docker logs verify || true